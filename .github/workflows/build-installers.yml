name: Instaladores

# Gera os instaladores das duas plataformas. Rodar isto em CI não é luxo: o
# instalador do Windows precisa ser compilado no Windows (Inno Setup não roda
# em Linux), então sem esta esteira seria preciso ter as duas máquinas à mão
# para publicar uma versão.
#
# Disparos:
#   - manual (aba Actions → Run workflow): gera os artefatos para download
#   - push de uma tag v*: gera os artefatos E publica um Release com eles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Necessário mesmo com QT_QPA_PLATFORM=offscreen: o import do PySide6
      # carrega libEGL antes de qualquer plataforma ser escolhida, então sem
      # isto os testes de widget nem chegam a ser coletados.
      - name: Bibliotecas de sistema do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  linux:
    name: Linux (.run + .deb)
    needs: testes
    runs-on: ubuntu-22.04
    # 22.04 de propósito: o binário fica ligado à glibc da máquina que compila,
    # então construir na versão mais antiga ainda suportada é o que faz o
    # instalador rodar também nas distros mais novas. O contrário não vale.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Bibliotecas de sistema do Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Construir instalador e pacote
        env:
          PYTHON: python
        run: ./packaging/linux/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-linux
          path: |
            dist/*.run
            dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (Setup.exe)
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construir instalador
        shell: pwsh
        run: .\packaging\windows\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/*Setup.exe
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Criar o release
        uses: softprops/action-gh-release@v2
        with:
          files: artefatos/**/*
          generate_release_notes: true
          body: |
            ## Instalação

            **Windows:** baixe o `...-windows-x64-Setup.exe`, execute e siga o
            assistente. O Windows pode mostrar um aviso do SmartScreen porque o
            instalador não tem assinatura digital paga — clique em
            "Mais informações" → "Executar assim mesmo".

            **Linux (qualquer distro):** baixe o `.run`, e então:

            ```bash
            chmod +x TelegramJellyfinOrganizer-*-linux-amd64.run
            ./TelegramJellyfinOrganizer-*-linux-amd64.run
            ```

            **Debian/Ubuntu/Mint:** baixe o `.deb` e instale com
            `sudo apt install ./telegram-jellyfin-organizer_*.deb`.
